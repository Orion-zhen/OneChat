[package]
name = "onechat"
edition = "2024"
description = "Your last one chatbox app."

[package.metadata.packager]
product-name = "OneChat"
identifier = "com.orion.onechat"
category = "Productivity"
out-dir = "target/release/bundle"
before-packaging-command = "cargo build --release"
icons = [
    "assets/icons/macos/onechat.icns",
    "assets/icons/windows/onechat.ico",
    "assets/icons/linux/hicolor/*/apps/onechat.png",
]

[package.metadata.packager.macos]
signing-identity = "-"
info-plist-path = "assets/macos/Info.plist"

[package.metadata.packager.dmg]
window-size = { width = 600, height = 400 }
app-position = { x = 180, y = 190 }
application-folder-position = { x = 420, y = 190 }

[package.metadata.packager.deb]
depends = ["libgtk-3-0", "libwebkit2gtk-4.1-0"]

[package.metadata.packager.pacman]
depends = ["gtk3", "webkit2gtk-4.1"]

[package.metadata.packager.linux]
generate-desktop-entry = true

[dependencies]
async-channel = "*"
async-trait = "*"
base64 = "*"
chrono = "*"
comrak = { version = "*", default-features = false }
futures-util = "*"
hayro = "*"
hound = "*"
image = { version = "*", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "pnm", "tiff", "webp"] }
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "runtime_shaders", "wayland", "x11"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
json5 = "*"
jsonc-parser = { version = "*", features = ["cst", "serde_json"] }
lucide-icons = "*"
reqwest = { version = "*", features = ["socks"] }
rig-core = "*"
rodio = { version = "*", default-features = false, features = ["mp3", "playback", "wav"] }
rmcp = { version = "*", default-features = false, features = ["auth", "client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
ratex-layout = "*"
ratex-parser = "*"
ratex-svg = { version = "*", features = ["embed-fonts"] }
ratex-types = "*"
serde = { version = "*", features = ["derive"] }
serde_json = "*"
tokio = { version = "*", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "*", features = ["rt"] }
two-face = "*"
unicode-segmentation = "*"
unicode-linebreak = "*"
undoc = "*"
url = "*"
zip = { version = "*", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "*"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "*"

[target.'cfg(unix)'.dependencies]
libc = "*"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "*"
objc2 = "*"
objc2-app-kit = { version = "*", default-features = false, features = [
    "NSEvent",
    "NSImage",
    "NSFont",
    "NSFontDescriptor",
    "NSFontManager",
    "NSHapticFeedback",
    "NSPressureConfiguration",
    "NSResponder",
    "NSView",
    "objc2-core-foundation",
] }
objc2-foundation = { version = "*", default-features = false, features = [
    "NSAttributedString",
    "NSData",
    "NSError",
    "NSGeometry",
    "NSRange",
    "NSString",
    "NSValue",
] }
objc2-web-kit = { version = "*", default-features = false, features = [
    "block2",
    "objc2-app-kit",
    "objc2-core-foundation",
    "WKNavigation",
    "WKSnapshotConfiguration",
    "WKWebView",
    "WKWebViewConfiguration",
    "WKWebsiteDataStore",
] }
objc2-natural-language = { version = "*", default-features = false, features = [
    "std",
    "NLTokenizer",
] }
raw-window-handle = "*"

[target.'cfg(target_os = "linux")'.dependencies]
cairo-rs = { version = "*", features = ["png"] }
gtk = "*"
webkit2gtk = "*"

[target.'cfg(windows)'.dependencies]
webview2-com = "*"
windows = { version = "*", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "*", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Environment",
    "Win32_System_Threading",
] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
