[package]
name = "onechat"
edition = "2024"
description = "A minimal cross-platform LLM chat app"

[dependencies]
async-channel = "*"
chrono = "*"
comrak = { version = "*", default-features = false }
futures-util = "*"
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "runtime_shaders", "wayland", "x11"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
json5 = "*"
lucide-icons = "*"
reqwest = { version = "*", features = ["socks"] }
rig-core = "*"
ratex-layout = "*"
ratex-parser = "*"
ratex-svg = { version = "*", features = ["embed-fonts"] }
ratex-types = "*"
serde = { version = "*", features = ["derive"] }
serde_json = "*"
tokio = { version = "*", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "*", features = ["rt"] }
two-face = "*"
unicode-segmentation = "*"
unicode-linebreak = "*"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
