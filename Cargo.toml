[package]
name = "onechat"
edition = "2024"
description = "A minimal cross-platform LLM chat app"

[dependencies]
async-channel = "*"
chrono = "*"
comrak = { version = "*", default-features = false }
futures-util = "*"
gpui = "*"
reqwest = { version = "*", features = ["socks"] }
rig-core = "*"
ratex-layout = "*"
ratex-parser = "*"
ratex-svg = { version = "*", features = ["embed-fonts"] }
ratex-types = "*"
rusqlite = "*"
serde = { version = "*", features = ["derive"] }
serde_json = "*"
tokio = { version = "*", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "*", features = ["rt"] }
unicode-segmentation = "*"
